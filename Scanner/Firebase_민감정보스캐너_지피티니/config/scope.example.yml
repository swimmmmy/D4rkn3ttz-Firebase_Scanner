version: 2
authorization:
  acknowledged: true
  reference: "OWNER-APPROVAL-OR-SECURITY-TICKET"
  approved_by: "project-owner"
  expires_at: "2027-12-31T23:59:59+09:00"
mode:
  passive_scan: true
  owner_mode: false
targets:
  origins: ["https://authorized.example"]
  firebase_project_ids: ["authorized-project"]
  realtime_database_urls: ["https://authorized-project-default-rtdb.firebaseio.com"]
  firestore:
    - project_id: "authorized-project"
      database_id: "(default)"
      allowed_paths: ["public", "users/{TEST_UID}/profile"]
  storage:
    - bucket: "authorized-project.firebasestorage.app"
      allowed_prefixes: ["public"]
      allowed_objects: ["public/status.json"]
discovery:
  max_crawl_depth: 1
  max_html_pages: 5
  max_javascript_assets: 30
  allow_same_origin_navigation: true
  allow_referenced_cross_origin_assets: true
  allow_referenced_source_maps: false
  allowed_asset_origins: ["https://authorized-cdn.example"]
  allowed_asset_mime_types: ["application/javascript", "text/javascript", "application/json", "text/css"]
  max_asset_bytes: 1048576
realtime_database:
  allow_root_shallow_probe: false
sampling:
  max_rtdb_paths: 20
  max_rtdb_top_level_keys: 20
  max_documents_per_collection: 3
  max_storage_objects_per_prefix: 10
  max_bytes_per_object: 65536
  max_response_bytes: 262144
  max_decompressed_response_bytes: 524288
  max_total_sample_bytes: 1048576
network:
  requests_per_second: 2
  max_concurrency: 4
  connect_timeout_seconds: 5
  read_timeout_seconds: 10
  write_timeout_seconds: 5
  pool_timeout_seconds: 5
  max_redirects: 3
  max_retries: 2
  user_agent: "FirebaseSecurityAuditor/1.0 Authorized-Security-Assessment"
safety:
  allow_private_network_targets: false
  allow_live_write_methods: false
  store_raw_responses: false
  allow_remote_javascript_execution: false
  allow_external_telemetry: false
owner_mode:
  allow_inventory: false
  allow_api_key_management_read: false
research:
  anonymize_targets: true
  hmac_salt_env: "FIREBASE_AUDIT_SALT"
